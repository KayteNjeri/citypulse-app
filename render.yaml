services:
  - type: web
    name: citypulse-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app app db upgrade
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_DEBUG
        value: "false"
      - key: DEV_AUTH_STUB
        value: "false"
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: citypulse-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://citypulse-web.onrender.com
      - key: TICKETMASTER_API_KEY
        sync: false

  - type: web
    name: citypulse-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://citypulse-api.onrender.com/api

databases:
  - name: citypulse-db
    databaseName: citypulse
    user: citypulse
