name: CityPulse CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  client:
    name: Client tests, lint, and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: https://example.invalid/api

  server:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: citypulse
          POSTGRES_PASSWORD: citypulse
          POSTGRES_DB: citypulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citypulse -d citypulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://citypulse:citypulse@localhost:5432/citypulse_test
          DATABASE_URL: sqlite:///ci-fallback.db
          FLASK_SECRET_KEY: ci-only-secret-not-for-production
          JWT_SECRET_KEY: ci-only-jwt-secret-not-for-production
